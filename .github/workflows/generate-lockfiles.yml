name: generate-lockfiles

on:
  push:
    branches:
      - tmp/generate-lockfiles-final2
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Rust lockfiles
        run: |
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path crates/topo-native-host/Cargo.toml
      - name: Upload lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: topo-lockfiles
          path: |
            package-lock.json
            apps/desktop/src-tauri/Cargo.lock
            crates/topo-native-host/Cargo.lock
          if-no-files-found: error
          retention-days: 1
