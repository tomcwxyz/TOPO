name: patch-windows-ci-install

on:
  push:
    branches:
      - tmp/generate-lockfiles-final2
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reproducible-windows-alpha
      - name: Avoid unrelated native npm lifecycle builds on Windows desktop jobs
        shell: python
        run: |
          from pathlib import Path

          installer = Path('.github/workflows/windows-test-installer.yml')
          text = installer.read_text()
          marker = '      - name: Install locked dependencies\n        run: npm ci\n\n      - name: Require current Rust lockfiles'
          replacement = '      - name: Install locked dependencies without unrelated native lifecycle scripts\n        run: npm ci --ignore-scripts\n\n      - name: Require current Rust lockfiles'
          if marker not in text:
              raise SystemExit('Windows installer npm ci marker not found')
          installer.write_text(text.replace(marker, replacement, 1))

          smoke = Path('.github/workflows/desktop-smoke.yml')
          text = smoke.read_text()
          before, rest = text.split('\n  windows:\n', 1)
          windows, after = rest.split('\n  macos:\n', 1)
          if '      - run: npm ci\n' not in windows:
              raise SystemExit('Windows desktop smoke npm ci marker not found')
          windows = windows.replace('      - run: npm ci\n', '      - run: npm ci --ignore-scripts\n', 1)
          smoke.write_text(before + '\n  windows:\n' + windows + '\n  macos:\n' + after)
      - name: Commit CI fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-test-installer.yml .github/workflows/desktop-smoke.yml
          git diff --cached --quiet && exit 0
          git commit -m "Avoid unrelated native npm builds in Windows desktop CI"
          git pull --rebase origin fix/reproducible-windows-alpha
          git push origin HEAD:fix/reproducible-windows-alpha
