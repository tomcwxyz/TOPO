name: generate-lockfiles

on:
  push:
    branches:
      - tmp/generate-lockfiles-final2
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reproducible-windows-alpha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Rust lockfiles
        run: |
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path crates/topo-native-host/Cargo.toml
      - name: Commit generated lockfiles to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/desktop/src-tauri/Cargo.lock crates/topo-native-host/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Pin npm and Rust dependencies for alpha builds"
          git push origin HEAD:fix/reproducible-windows-alpha
