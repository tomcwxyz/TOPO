name: release-alpha3-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-alpha3-once.yml"

permissions:
  contents: write

jobs:
  release-windows:
    name: TOPO 0.1.1-alpha.3 · Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Bump desktop version and regenerate locks
        shell: pwsh
        run: |
          $old = "0.1.1-alpha.2"
          $new = "0.1.1-alpha.3"
          $paths = @(
            "apps/desktop/package.json",
            "apps/desktop/src-tauri/tauri.conf.json",
            "apps/desktop/src-tauri/Cargo.toml"
          )
          foreach ($path in $paths) {
            $text = Get-Content $path -Raw
            if ($text -notmatch [regex]::Escape($old)) { throw "$path does not contain expected version $old" }
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }
          npm install --package-lock-only --ignore-scripts
          cargo metadata --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml | Out-Null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml | Out-Null
          node scripts/check-desktop-version.mjs $new

      - name: Commit alpha.3 version to main and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-alpha3-once.yml
          git add apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock package-lock.json
          git commit -m "Release: bump TOPO desktop to 0.1.1-alpha.3"
          git push origin HEAD:main

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare packaged browser capture companion
        shell: pwsh
        run: |
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Build unsigned Windows NSIS installer
        run: npm run tauri --workspace @topo/desktop -- build --bundles nsis --config src-tauri/test.windows.json

      - name: Verify versioned installer and scan with Microsoft Defender
        shell: pwsh
        run: |
          $nativeHost = Get-Item "target/release/topo-native-host.exe"
          $desktop = Get-Item "apps/desktop/src-tauri/target/release/topo.exe"
          $installer = Get-Item "apps/desktop/src-tauri/target/release/bundle/nsis/TOPO_0.1.1-alpha.3_x64-setup.exe"
          $files = @($nativeHost, $desktop, $installer)

          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $status -or -not $status.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus is not enabled; refusing to publish an unchecked Windows alpha."
          }

          $candidates = @()
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          if (Test-Path $platformRoot) {
            $latestPlatform = Get-ChildItem $platformRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latestPlatform) { $candidates += (Join-Path $latestPlatform.FullName "MpCmdRun.exe") }
          }
          $candidates += (Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe")
          $mpcmd = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mpcmd) { throw "Microsoft Defender command-line scanner was not found." }

          & $mpcmd -SignatureUpdate
          foreach ($file in $files) {
            $scanLog = Join-Path $env:RUNNER_TEMP ("defender-" + $file.Name + ".log")
            Remove-Item $scanLog -ErrorAction SilentlyContinue
            & $mpcmd -Scan -ScanType 3 -File $file.FullName -DisableRemediation 2>&1 | Tee-Object -FilePath $scanLog
            $scanExit = $LASTEXITCODE
            $scanText = if (Test-Path $scanLog) { Get-Content $scanLog -Raw } else { "" }
            if ($scanText -match '(?i)was skipped') { throw "Defender skipped $($file.Name)." }
            if ($scanExit -ne 0) { throw "Defender did not return clean for $($file.Name); exit $scanExit" }
            if ($scanText -notmatch '(?i)found no threats|detected 0 threats') {
              throw "Defender returned no positive clean-scan result for $($file.Name)."
            }
          }

          $hashFile = "TOPO_0.1.1-alpha.3_windows_SHA256SUMS.txt"
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Tee-Object -FilePath $hashFile -Append
          }

      - name: Upload TOPO alpha.3 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TOPO_0.1.1-alpha.3_windows_x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/TOPO_0.1.1-alpha.3_x64-setup.exe
            TOPO_0.1.1-alpha.3_windows_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
