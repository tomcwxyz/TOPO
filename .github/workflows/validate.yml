name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Validate Hermes adapter syntax
        run: python3 -m py_compile adapters/hermes/__init__.py scripts/install-hermes-topo-plugin.py
      - run: npm run validate
