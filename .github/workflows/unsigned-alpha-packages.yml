name: unsigned-alpha-packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unsigned-alpha-packages.yml"
  workflow_dispatch:

concurrency:
  group: topo-unsigned-alpha-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 · unsigned NSIS alpha
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies without unrelated native lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require current Rust lockfiles
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml | Out-Null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml | Out-Null
      - name: Prepare packaged browser capture companion
        shell: pwsh
        run: |
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force
      - name: Build unsigned Windows NSIS installer
        run: npm run tauri --workspace @topo/desktop -- build --bundles nsis --config src-tauri/test.windows.json
      - name: Scan Windows binaries and installer with Microsoft Defender
        shell: pwsh
        run: |
          $nativeHost = Get-Item "target/release/topo-native-host.exe"
          $desktop = Get-Item "apps/desktop/src-tauri/target/release/topo.exe"
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -eq 0) { throw "No Windows NSIS installer was produced." }
          $files = @($nativeHost, $desktop) + $installers

          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $status -or -not $status.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus is not enabled on the Windows alpha runner; do not publish an unchecked Windows test artefact."
          }
          Write-Host "Defender signature version: $($status.AntivirusSignatureVersion)"
          Write-Host "Defender signature updated: $($status.AntivirusSignatureLastUpdated)"

          $candidates = @()
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          if (Test-Path $platformRoot) {
            $latestPlatform = Get-ChildItem $platformRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latestPlatform) {
              $candidates += (Join-Path $latestPlatform.FullName "MpCmdRun.exe")
            }
          }
          $candidates += (Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe")
          $mpcmd = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mpcmd) {
            throw "Microsoft Defender command-line scanner (MpCmdRun.exe) was not found; do not publish an unchecked Windows test artefact."
          }
          Write-Host "Using Defender scanner: $mpcmd"

          & $mpcmd -SignatureUpdate
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Defender signature refresh returned exit code $LASTEXITCODE; continuing with the installed signatures reported above."
          }

          foreach ($file in $files) {
            Write-Host "Scanning $($file.FullName) with Microsoft Defender..."
            $scanLog = Join-Path $env:RUNNER_TEMP ("defender-" + $file.Name + ".log")
            Remove-Item $scanLog -ErrorAction SilentlyContinue
            & $mpcmd -Scan -ScanType 3 -File $file.FullName -DisableRemediation 2>&1 | Tee-Object -FilePath $scanLog
            $scanExit = $LASTEXITCODE
            $scanText = if (Test-Path $scanLog) { Get-Content $scanLog -Raw } else { "" }

            if ($scanText -match '(?i)was skipped') {
              throw "Microsoft Defender skipped $($file.Name); Windows release acceptance requires an actual scan."
            }
            if ($scanExit -ne 0) {
              throw "Microsoft Defender did not return a clean result for $($file.Name); MpCmdRun exit code: $scanExit"
            }
            if ($scanText -notmatch '(?i)found no threats|detected 0 threats') {
              throw "Microsoft Defender returned no positive clean-scan result for $($file.Name); refusing to publish an unchecked artefact."
            }
          }

          $hashFile = "TOPO_windows_SHA256SUMS.txt"
          Remove-Item $hashFile -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Tee-Object -FilePath $hashFile -Append
          }
      - name: Upload Windows unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: TOPO_UNSIGNED_TEST_windows_x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            TOPO_windows_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 · unsigned deb + AppImage alpha
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: npm ci
      - name: Require current Rust lockfiles
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null
      - name: Prepare packaged browser companion and verified local-engine installer
        shell: bash
        run: |
          set -euo pipefail
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          resources="apps/desktop/src-tauri/resources"
          rm -rf "$resources"
          mkdir -p "$resources/capture-extension"
          cp -R apps/extension/dist/. "$resources/capture-extension/"
          install -m 0755 target/release/topo-native-host "$resources/topo-native-host"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.33.3/install.sh" \
            --output "$resources/ollama-install.sh"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $resources/ollama-install.sh" | sha256sum --check --strict
          chmod 0755 "$resources/ollama-install.sh"
      - name: Build Linux packages
        run: npm run tauri --workspace @topo/desktop -- build --bundles deb,appimage
      - name: Require both Linux package formats
        shell: bash
        run: |
          set -euo pipefail
          compgen -G "apps/desktop/src-tauri/target/release/bundle/deb/*.deb" > /dev/null
          compgen -G "apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null
      - name: Upload Linux unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: TOPO_UNSIGNED_TEST_linux_x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS · unsigned DMG alpha
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: npm ci
      - name: Require current Rust lockfiles
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null
      - name: Prepare packaged browser capture companion
        shell: bash
        run: |
          set -euo pipefail
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          resources="apps/desktop/src-tauri/resources"
          rm -rf "$resources"
          mkdir -p "$resources/capture-extension"
          cp -R apps/extension/dist/. "$resources/capture-extension/"
          install -m 0755 target/release/topo-native-host "$resources/topo-native-host"
      - name: Generate macOS icon from canonical PNG
        shell: bash
        run: |
          set -euo pipefail
          src="apps/desktop/src-tauri/icons/icon.png"
          iconset="$RUNNER_TEMP/topo.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$src" --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "apps/desktop/src-tauri/icons/icon.icns"
          node - <<'NODE'
          const fs = require('fs');
          const p = 'apps/desktop/src-tauri/tauri.conf.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.bundle.icon = ['icons/icon.png', 'icons/icon.ico', 'icons/icon.icns'];
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE
      - name: Build unsigned macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri --workspace @topo/desktop -- build --bundles dmg
      - name: Require macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          compgen -G "apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg" > /dev/null
      - name: Upload macOS unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: TOPO_UNSIGNED_TEST_macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
