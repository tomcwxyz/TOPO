name: Desktop alpha release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to release (must match source, e.g. 0.1.1-alpha.4)"
        required: true
        type: string
      confirm:
        description: "Type RELEASE to publish the GitHub prerelease"
        required: true
        type: string

concurrency:
  group: topo-desktop-alpha-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Require main, confirmation and matching version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Desktop releases must be dispatched from main."
            exit 1
          fi
          if [[ "$RELEASE_CONFIRMATION" != "RELEASE" ]]; then
            echo "::error::Type RELEASE in the confirmation input."
            exit 1
          fi
          node scripts/check-desktop-version.mjs "$EXPECTED_VERSION"

      - name: Install locked dependencies
        run: npm ci

      - name: Require current Rust lockfiles
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-contracts/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null

      - name: Re-run repository validation
        run: npm run validate

  build:
    name: ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 · unsigned NSIS
            artifact: topo-release-windows-x64
          - os: ubuntu-22.04
            label: Linux x64 · deb + AppImage
            artifact: topo-release-linux-x64
          - os: macos-latest
            label: macOS · unsigned DMG
            artifact: topo-release-macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked dependencies
        run: npm ci

      - name: Require current Rust lockfiles
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null

      - name: Build browser extension
        run: npm run test:extension-build

      - name: Package Windows browser companion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Package Unix browser companion
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          resources="apps/desktop/src-tauri/resources"
          rm -rf "$resources"
          mkdir -p "$resources/capture-extension"
          cp -R apps/extension/dist/. "$resources/capture-extension/"
          install -m 0755 target/release/topo-native-host "$resources/topo-native-host"

      - name: Add verified Linux local-engine installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          resources="apps/desktop/src-tauri/resources"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.33.3/install.sh" \
            --output "$resources/ollama-install.sh"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $resources/ollama-install.sh" \
            | sha256sum --check --strict
          chmod 0755 "$resources/ollama-install.sh"

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          src="apps/desktop/src-tauri/icons/icon.png"
          iconset="$RUNNER_TEMP/topo.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$src" --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "apps/desktop/src-tauri/icons/icon.icns"
          node - <<'NODE'
          const fs = require('fs');
          const p = 'apps/desktop/src-tauri/tauri.conf.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.bundle.icon = ['icons/icon.png', 'icons/icon.ico', 'icons/icon.icns'];
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri --workspace @topo/desktop -- build --bundles nsis --config src-tauri/test.windows.json

      - name: Scan Windows binaries with Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeHost = Get-Item "target/release/topo-native-host.exe"
          $desktop = Get-Item "apps/desktop/src-tauri/target/release/topo.exe"
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -eq 0) { throw "No Windows NSIS installer was produced." }

          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $status -or -not $status.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus is not enabled on the Windows release runner."
          }

          $candidates = @()
          $platformRoot = Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform"
          if (Test-Path $platformRoot) {
            $latestPlatform = Get-ChildItem $platformRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latestPlatform) {
              $candidates += (Join-Path $latestPlatform.FullName "MpCmdRun.exe")
            }
          }
          $candidates += (Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe")
          $mpcmd = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mpcmd) { throw "Microsoft Defender command-line scanner was not found." }

          $files = @($nativeHost, $desktop) + $installers
          foreach ($file in $files) {
            $scanLog = Join-Path $env:RUNNER_TEMP ("defender-" + $file.Name + ".log")
            & $mpcmd -Scan -ScanType 3 -File $file.FullName -DisableRemediation 2>&1 | Tee-Object -FilePath $scanLog
            $scanExit = $LASTEXITCODE
            $scanText = if (Test-Path $scanLog) { Get-Content $scanLog -Raw } else { "" }
            if ($scanText -match '(?i)was skipped') { throw "Defender skipped $($file.Name)." }
            if ($scanExit -ne 0) { throw "Defender did not return a clean result for $($file.Name)." }
            if ($scanText -notmatch '(?i)found no threats|detected 0 threats') {
              throw "Defender returned no positive clean-scan result for $($file.Name)."
            }
          }

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri --workspace @topo/desktop -- build --bundles deb,appimage

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri --workspace @topo/desktop -- build --bundles dmg

      - name: Prepare Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer found." }
          $dest = "release-assets/TOPO_$($env:VERSION)_windows_x64_setup.exe"
          Copy-Item $installer.FullName $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $dest -Leaf)" | Set-Content "release-assets/TOPO_$($env:VERSION)_windows_x64_SHA256SUMS.txt"

      - name: Prepare Linux release assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          deb="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          appimage="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          cp "$deb" "release-assets/TOPO_${VERSION}_linux_x64.deb"
          cp "$appimage" "release-assets/TOPO_${VERSION}_linux_x64.AppImage"
          (
            cd release-assets
            sha256sum "TOPO_${VERSION}_linux_x64.deb" "TOPO_${VERSION}_linux_x64.AppImage" > "TOPO_${VERSION}_linux_x64_SHA256SUMS.txt"
          )

      - name: Prepare macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          arch="$(uname -m)"
          cp "$dmg" "release-assets/TOPO_${VERSION}_macos_${arch}.dmg"
          (
            cd release-assets
            shasum -a 256 "TOPO_${VERSION}_macos_${arch}.dmg" > "TOPO_${VERSION}_macos_${arch}_SHA256SUMS.txt"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: topo-release-*
          path: release-assets
          merge-multiple: true

      - name: Show release payload
        run: ls -lh release-assets

      - name: Publish visible GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="topo-v${VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the desktop version before publishing another release."
            exit 1
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          TOPO ${VERSION} is an alpha desktop release for hands-on testing.

          ### Installers

          - **Windows x64:** NSIS installer
          - **macOS:** DMG
          - **Linux x64:** Debian package and AppImage
          - SHA-256 checksum files are included alongside the installers.

          ### Alpha trust note

          The Windows and macOS alpha packages are currently unsigned. Windows SmartScreen and macOS Gatekeeper may therefore show trust warnings. Do not disable endpoint security to install TOPO. Trusted code signing/notarisation remains a release gate before TOPO is presented as a stable or wider public distribution.

          ### What this alpha is for

          This release is for dogfooding the complete TOPO loop: capture useful context, review what is worth keeping, find it again in Memories, and selectively use approved context in another tool.

          Core TOPO data remains local and no TOPO account is required.
          EOF

          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "TOPO ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
