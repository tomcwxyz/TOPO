name: Local alpha desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to release (must match source)"
        required: true
        type: string
      confirm:
        description: "Type RELEASE to confirm the desktop alpha release"
        required: true
        type: string

concurrency:
  group: topo-local-alpha-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Desktop release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Require main and explicit confirmation
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Desktop releases must be dispatched from main."
            exit 1
          fi
          if [[ "$RELEASE_CONFIRMATION" != "RELEASE" ]]; then
            echo "::error::Type RELEASE in the confirmation input."
            exit 1
          fi
          node scripts/check-desktop-version.mjs "$EXPECTED_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Re-run repository validation
        run: npm run validate

  publish:
    name: ${{ matrix.label }}
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64 · signed NSIS
            args: "--bundles nsis --config src-tauri/release.windows.json"
          - platform: ubuntu-22.04
            label: Linux x64 · deb + AppImage
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm install

      - name: Build browser extension
        run: npm run test:extension-build

      - name: Package Windows browser companion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Package Linux browser companion and local-engine installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          resources="apps/desktop/src-tauri/resources"
          rm -rf "$resources"
          mkdir -p "$resources/capture-extension"
          cp -R apps/extension/dist/. "$resources/capture-extension/"
          install -m 0755 target/release/topo-native-host "$resources/topo-native-host"

          # Pin the official Ollama Linux installer used by TOPO's graphical
          # first-run setup. The user never needs to paste a terminal command.
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.33.3/install.sh" \
            --output "$resources/ollama-install.sh"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $resources/ollama-install.sh" \
            | sha256sum --check --strict
          chmod 0755 "$resources/ollama-install.sh"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE is required for user-facing Windows releases." }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required for user-facing Windows releases." }
          if (-not $env:WINDOWS_TIMESTAMP_URL) { throw "WINDOWS_TIMESTAMP_URL is required for user-facing Windows releases." }

          $pfxPath = Join-Path $env:RUNNER_TEMP "topo-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "The Windows signing certificate could not be imported." }

          $releaseConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "apps/desktop/src-tauri/release.windows.json" -Value $releaseConfig -Encoding UTF8

      - name: Build and create draft desktop release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: apps/desktop
          tagName: topo-v__VERSION__
          releaseName: "TOPO __VERSION__ · desktop alpha"
          releaseBody: |
            Installer-first TOPO desktop alpha for Windows and Linux.

            - Windows uses a signed per-user NSIS installer.
            - Linux ships a Debian package and AppImage.
            - Browser capture resources are bundled on both platforms.
            - Linux local-engine setup is launched from TOPO with a normal graphical PolicyKit prompt; there are no copy/paste terminal instructions.
            - Setup happens inside TOPO; users do not need Node, npm, Rust, Cargo or terminal commands.
            - Core data remains local in ~/.topo/topo.sqlite and no account is required.

            Windows signing is a release requirement because the user-facing installer should not ask people to bypass SmartScreen. Code signing materially reduces trust warnings, although no signing process can guarantee that every endpoint-security product will never raise a false positive.
          releaseDraft: true
          prerelease: true
          releaseAssetNamePattern: "TOPO_[version]_[platform]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: Verify packaged Windows Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -eq 0) { throw "No Windows installer was produced for signature verification." }

          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
            if (-not $signature.SignerCertificate.Subject) {
              throw "Windows installer $($installer.Name) has no signer identity."
            }
            Write-Host "Verified $($installer.Name) signed by $($signature.SignerCertificate.Subject)"
          }
