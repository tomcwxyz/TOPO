name: Windows test installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-test-installer.yml"

concurrency:
  group: topo-windows-test-installer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build TOPO Windows test installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Prepare packaged browser capture companion
        shell: pwsh
        run: |
          npm run test:extension-build
          cargo build --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Check desktop TypeScript
        run: npm run check --workspace @topo/desktop

      - name: Build unsigned Windows installer and draft test release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: apps/desktop
          tagName: topo-test-${{ github.run_number }}
          releaseName: "TOPO Windows test · run ${{ github.run_number }}"
          releaseBody: |
            Windows test installer built from current TOPO main for hands-on loop testing.

            This is an unsigned development/test build. Windows SmartScreen may warn before installation.

            The installer includes the Windows native capture bridge and browser extension files. No Node, npm, Rust or Cargo installation is required to run this packaged desktop app.
          releaseDraft: true
          prerelease: true
          releaseAssetNamePattern: "TOPO_Windows_Test_[version]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: "--bundles nsis --config src-tauri/test.windows.json"
