name: Internal Windows installer smoke test

on:
  workflow_dispatch:

concurrency:
  group: topo-windows-installer-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build internal unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Prepare packaged browser capture companion
        shell: pwsh
        run: |
          npm run test:extension-build
          cargo build --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Check desktop TypeScript
        run: npm run check --workspace @topo/desktop

      - name: Build unsigned smoke-test installer
        run: npm run tauri --workspace @topo/desktop -- build -- --bundles nsis --config src-tauri/test.windows.json

      - name: Upload internal installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: topo-windows-unsigned-smoke
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
