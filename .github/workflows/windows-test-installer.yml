name: installer-package-smoke

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/extension/**"
      - "crates/topo-native-host/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-alpha-release.yml"
      - ".github/workflows/windows-test-installer.yml"
  workflow_dispatch:

concurrency:
  group: topo-installer-package-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows NSIS smoke installer
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies without unrelated native lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Require current Rust lockfiles
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml | Out-Null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml | Out-Null

      - name: Prepare packaged browser capture companion
        shell: pwsh
        run: |
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          $resources = "apps/desktop/src-tauri/resources"
          Remove-Item -Recurse -Force $resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$resources/capture-extension" | Out-Null
          Copy-Item "apps/extension/dist/*" "$resources/capture-extension" -Recurse -Force
          Copy-Item "target/release/topo-native-host.exe" "$resources/topo-native-host.exe" -Force

      - name: Build internal unsigned Windows installer
        run: npm run tauri --workspace @topo/desktop -- build --bundles nsis --config src-tauri/test.windows.json

      - name: Require packaged Windows binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/topo-native-host.exe")) { throw "TOPO native host was not produced." }
          if (-not (Test-Path "apps/desktop/src-tauri/target/release/topo.exe")) { throw "TOPO desktop executable was not produced." }
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -eq 0) { throw "TOPO did not produce an NSIS installer." }
          foreach ($installer in $installers) {
            Write-Host "Packaged $($installer.Name) ($($installer.Length) bytes)"
          }

      - name: Scan native host, desktop app and installer with Microsoft Defender
        shell: pwsh
        run: |
          $nativeHost = Get-Item "target/release/topo-native-host.exe"
          $desktop = Get-Item "apps/desktop/src-tauri/target/release/topo.exe"
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          $files = @($nativeHost, $desktop) + $installers

          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $status -or -not $status.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus is not enabled on this hosted runner; Windows acceptance cannot pass without a scan."
          }

          Write-Host "Defender signature version: $($status.AntivirusSignatureVersion)"
          Write-Host "Defender signature updated: $($status.AntivirusSignatureLastUpdated)"
          try { Update-MpSignature -ErrorAction Stop | Out-Null } catch { Write-Warning "Could not refresh Defender signatures: $($_.Exception.Message)" }

          foreach ($file in $files) {
            Write-Host "Scanning $($file.FullName) with Microsoft Defender..."
            Start-MpScan -ScanPath $file.FullName -ScanType CustomScan
            $detections = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
            $escaped = [Regex]::Escape($file.FullName)
            $hits = @($detections | Where-Object {
              ($_.Resources -join "`n") -match $escaped
            })
            if ($hits.Count -gt 0) {
              $ids = ($hits | ForEach-Object { $_.ThreatID }) -join ", "
              throw "Microsoft Defender reported $($file.Name) as a threat. Threat IDs: $ids"
            }
          }

          $hashFile = "TOPO_windows_SHA256SUMS.txt"
          Remove-Item $hashFile -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Tee-Object -FilePath $hashFile -Append
          }

      - name: Upload internal Windows package and hashes
        uses: actions/upload-artifact@v4
        with:
          name: topo-windows-unsigned-smoke
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            TOPO_windows_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Package Linux deb and AppImage smoke installers
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install locked dependencies
        run: npm ci

      - name: Require current Rust lockfiles
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/topo-native-host/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null

      - name: Prepare packaged browser companion and verified local-engine installer
        shell: bash
        run: |
          set -euo pipefail
          npm run test:extension-build
          cargo build --locked --release --target-dir target --manifest-path crates/topo-native-host/Cargo.toml
          resources="apps/desktop/src-tauri/resources"
          rm -rf "$resources"
          mkdir -p "$resources/capture-extension"
          cp -R apps/extension/dist/. "$resources/capture-extension/"
          install -m 0755 target/release/topo-native-host "$resources/topo-native-host"

          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v0.33.3/install.sh" \
            --output "$resources/ollama-install.sh"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $resources/ollama-install.sh" \
            | sha256sum --check --strict
          chmod 0755 "$resources/ollama-install.sh"

      - name: Build internal Linux packages
        run: npm run tauri --workspace @topo/desktop -- build --bundles deb,appimage

      - name: Require both Linux package formats
        shell: bash
        run: |
          set -euo pipefail
          compgen -G "apps/desktop/src-tauri/target/release/bundle/deb/*.deb" > /dev/null
          compgen -G "apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null
          ls -lh apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          ls -lh apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload internal Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: topo-linux-package-smoke
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
